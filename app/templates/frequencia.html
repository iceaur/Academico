<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequência</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <a class="navbar-brand" href="/">Acadêmico</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link text-dark" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link text-dark" href="/frequencia/">Frequência</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Tabela de Frequência</h2>
    <table class="table table-bordered">
      <thead class="thead-light">
        <tr>
          <th>Curso</th>
          <th>Disciplina</th>
          <th>Aluno</th>
          <th>Nº de Faltas</th>
        </tr>
      </thead>
      <tbody>
        {% for f in frequencias %}
        <tr>
          <td>{{ f.curso.nome }}</td>
          <td>{{ f.disciplina.nome }}</td>
          <td>{{ f.pessoa.nome }}</td>
          <td>{{ f.numero_faltas }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center">Nenhum registro de frequência encontrado.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
